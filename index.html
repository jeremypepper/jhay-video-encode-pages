<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Upload</title>
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card">
    <h1>Video Upload v3</h1>

    <section id="auth-section">
      <div id="google-signin-button"></div>
      <div id="signed-in-row" hidden>
        <span id="signed-in-as" class="muted"></span>
        <button id="sign-out-btn" class="link-btn">Sign out</button>
      </div>
    </section>

    <section id="upload-section">
      <label for="file-input">Video file</label>
      <div id="file-row">
        <input id="file-input" type="file" accept="video/*" />
        <span id="file-size" class="muted"></span>
      </div>
      <button id="upload-btn">Upload</button>

      <div id="progress-wrap" hidden>
        <progress id="progress-bar" value="0" max="100"></progress>
        <span id="progress-label">0%</span>
      </div>

      <p id="status-message" class="muted"></p>
      <a id="download-link" href="#" target="_blank" rel="noopener noreferrer" hidden>Download converted file</a>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
